<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jisajili — SIMU</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    </head>
<body>

<div class="auth-wrap">
    <div class="auth-box">
        <div class="auth-logo">SIMU<span>.</span></div>
        
        <div class="auth-header">
            <h1>Unda Akaunti 🎉</h1>
            <p>Jisajili ili kuanza kushiriki</p>
        </div>
        
        <div id="message" class="msg"></div>
        
        <form id="registerForm">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Jina Kamili</label>
                <input type="text" id="fullName" placeholder="Mfano: Juma Mwakyusa" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-at"></i> Username</label>
                <input type="text" id="username" placeholder="juma123" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="email" placeholder="juma@test.com" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="Herufi 6+" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Rudia Password</label>
                <input type="password" id="confirmPassword" placeholder="Weka tena" required>
            </div>
            
            <button type="submit" id="submitBtn" class="btn btn-primary btn-full">
                <i class="fas fa-user-plus"></i> Jisajili Sasa
            </button>
        </form>
        
        <div class="auth-footer">
            Una akaunti tayari? <a href="/login.html">Ingia Sasa</a>
        </div>
        
        <div class="auth-footer" style="margin-top: 10px;">
            <a href="/" style="color: #999;"><i class="fas fa-arrow-left"></i> Rudi Nyumbani</a>
        </div>
    </div>
</div>

<script>
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
    }
</script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
    // Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js')
                .then((registration) => {
                    console.log('✅ Service Worker registered:', registration.scope);
                })
                .catch((error) => {
                    console.log('❌ Service Worker registration failed:', error);
                });
        });
    }
</script>
</body>
</html>
